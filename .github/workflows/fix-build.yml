name: Fix and Build Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # استفاده از نسخه جدید برای رفع هشدار

      - name: Install dependencies
        run: npm install

      - name: Fix Expo dependencies
        run: |
          npx expo install --check
          npx expo install --fix
          npx expo-doctor || true # اگر خطا داد، ادامه بده

      - name: Apply overrides for Reanimated/Worklets
        run: |
          # این بخش مشکل سازگاری SDK 58 با Reanimated را حل می‌کند
          npx npm-add-script "overrides" '{"react-native-reanimated": "4.7.0", "react-native-worklets": "0.13.0"}' || true

      - name: Clean Gradle Cache
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew clean && cd ..
          fi

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add package.json package-lock.json
          git commit -m "Fix: هماهنگ‌سازی نسخه‌ها و رفع خطای Gradle" || echo "No changes to commit"
          git push

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
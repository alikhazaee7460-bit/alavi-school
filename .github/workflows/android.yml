
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download generated APK
        run: eas build:download --latest --platform android --path ./alavi-school.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: alavi-school-android-apk
          path: ./alavi-school.apk
          if-no-files-found: error
